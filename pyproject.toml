[project]
name = "pet-leather-studio"
version = "0.1.0"
description = "宠物皮革浮雕工作台（本地桌面应用）"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11",
    "trimesh>=4.0",
    "pillow>=10.0",
    "pyside6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pet-leather-studio = "pet_leather_studio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_leather_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "pet_leather_studio.domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "pet_leather_studio.application.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# 科学库边界：缺类型时在最小 adapter 范围抑制（PRD 11.1）
module = ["pyvista.*", "pyvistaqt.*", "trimesh.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
